# Receives OTLP traces from every service and exports them to its own log
# output for Sprint 1. Swapping in a real tracing backend (Jaeger/Tempo) is
# a config change here, not a code change -- see docs/adr/0002-telemetry-stack.md.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: basic

processors:
  batch: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
