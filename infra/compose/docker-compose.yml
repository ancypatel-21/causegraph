name: causegraph

x-app-build: &app-build
  context: ../..
  dockerfile: Dockerfile

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://causegraph:causegraph@postgres:5432/causegraph
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_INTERACTION_TOPIC: interaction-events
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAMESPACE: causegraph
  EVENT_API_URL: http://event-api:8001
  FEATURE_WORKER_URL: http://feature-worker:8002
  MODEL_SERVICE_URL: http://model-service:8003
  RANKING_API_URL: http://ranking-api:8004
  QUALITY_MONITOR_URL: http://quality-monitor:8005
  CAUSEGRAPH_API_URL: http://causegraph-api:8000
  PROMETHEUS_URL: http://prometheus:9090
  ALLOW_INTERVENTION_TESTS: "0"
  INTERVENTION_RECOVERY_SECONDS: "10.0"
  ENABLE_AGENT_SYNTHESIS: "0"
  CAUSEGRAPH_LLM_PROVIDER: mock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: causegraph
      POSTGRES_USER: causegraph
      POSTGRES_PASSWORD: causegraph
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causegraph"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.2
    ports: ["19092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["19090:9090"]

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4318:4318", "4317:4317"]

  causegraph-api:
    build: *app-build
    command: ["python", "-m", "uvicorn", "causegraph.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports: ["18000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  event-api:
    build: *app-build
    working_dir: /app/services/event-api
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *app-env
    ports: ["18001:8001"]
    depends_on:
      kafka:
        condition: service_healthy

  feature-worker:
    build: *app-build
    working_dir: /app/services/feature-worker
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment: *app-env
    ports: ["8002:8002"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      causegraph-api:
        condition: service_started

  model-service:
    build: *app-build
    working_dir: /app/services/model-service
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment: *app-env
    ports: ["8003:8003"]
    depends_on:
      redis:
        condition: service_healthy
      causegraph-api:
        condition: service_started

  ranking-api:
    build: *app-build
    working_dir: /app/services/ranking-api
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004"]
    environment: *app-env
    ports: ["8004:8004"]
    depends_on:
      - model-service

  quality-monitor:
    build: *app-build
    working_dir: /app/services/quality-monitor
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment: *app-env
    ports: ["8005:8005"]
    depends_on:
      - ranking-api

  benchmark-cli:
    build: *app-build
    environment: *app-env
    profiles: ["tools"]
    entrypoint: ["causegraph-cli"]
    command: ["--help"]
    volumes:
      - ../../experiments/results:/app/experiments/results
    depends_on:
      - causegraph-api
      - event-api
      - feature-worker
      - model-service
      - ranking-api
      - quality-monitor
      - prometheus
